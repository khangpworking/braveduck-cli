name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vet, format, unit + race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./... && go vet -tags browser ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - name: go mod tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: board JS syntax
        run: node --check internal/api/web/app.js
      - name: unit tests (race detector)
        run: go test -race -count=1 ./...

  browser:
    name: real-browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The runner image ships Google Chrome with all its libraries; point the
      # tests at it instead of downloading CloakBrowser (~217 MB).
      - name: browser tests
        env:
          CLOAKBROWSER_BINARY_PATH: /usr/bin/google-chrome
        run: go test -tags browser -count=1 -timeout 5m ./internal/core/browser/ ./internal/service/ ./internal/api/

  build:
    name: cross-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build ${{ matrix.target }}
        run: |
          export GOOS=${TARGET%/*} GOARCH=${TARGET#*/} CGO_ENABLED=0
          go build -trimpath -o /dev/null ./cmd/braveduck
        env:
          TARGET: ${{ matrix.target }}
