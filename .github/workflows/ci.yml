name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vet, format, unit + race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./... && go vet -tags browser ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - name: go mod tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: board JS syntax
        run: for f in internal/api/web/*.js; do node --check "$f" || exit 1; done
      - name: unit tests (race detector)
        run: go test -race -count=1 ./...

  web:
    name: new board (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: types, lint, unit tests
        run: npm run typecheck && npm run lint && npm test
      # The Go binary embeds internal/api/app, so it must be this source's build.
      - name: the committed build matches the source
        run: |
          npm run build
          if [ -n "$(git status --porcelain ../internal/api/app)" ]; then
            echo "internal/api/app is stale: run npm run build in web/ and commit it"
            git status --short ../internal/api/app; exit 1
          fi

  browser:
    name: real-browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The runner image ships Google Chrome with all its libraries; point the
      # tests at it instead of downloading CloakBrowser (~217 MB).
      - name: browser tests
        env:
          CLOAKBROWSER_BINARY_PATH: /usr/bin/google-chrome
        run: go test -tags browser -count=1 -timeout 5m ./internal/core/browser/ ./internal/service/ ./internal/api/

  build:
    name: cross-build + shared server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # One job for every target: billing rounds each job up to a minute.
      - name: build linux, macOS and Windows binaries
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            echo "== $target"
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/braveduck
          done
      # The shared server (deploy/hosted): its scripts, its compose file, the
      # image, and the whole chain with real Caddy and Authelia.
      - name: shared server scripts
        run: shellcheck deploy/hosted/*.sh
      - name: shared server compose file
        working-directory: deploy/hosted
        run: |
          mkdir -p secrets && for s in proxy_secret session_secret storage_encryption_key jwt_secret; do echo x > secrets/$s; done
          printf 'AUTH_DOMAIN=auth.example.com\n' > .env
          docker compose config --quiet
      - name: shared server chain (Caddy + Authelia + braveduck)
        run: deploy/hosted/test-local.sh

  stack:
    name: shared server stack (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Builds the image and runs Caddy + Authelia + braveduck as deployed.
      - name: docker compose up, then check it from outside
        run: deploy/hosted/test-compose.sh
