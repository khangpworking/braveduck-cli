# braveduck shared server: Caddy (HTTPS) → Authelia (logins) → braveduck.
# Set up once with ./setup.sh, add people with ./add-user.sh, then:
#   docker compose up -d --build
name: braveduck

services:
  caddy:
    image: caddy:2.11
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    secrets:
      - proxy_secret
    depends_on:
      - authelia
      - braveduck

  authelia:
    image: authelia/authelia:4.39
    restart: unless-stopped
    env_file: .env
    environment:
      X_AUTHELIA_CONFIG_FILTERS: template
      AUTHELIA_SESSION_SECRET_FILE: /run/secrets/session_secret
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /run/secrets/storage_encryption_key
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /run/secrets/jwt_secret
    volumes:
      - ./authelia:/config # configuration.yml, users_database.yml, its database
    secrets:
      - session_secret
      - storage_encryption_key
      - jwt_secret

  braveduck:
    build:
      context: ../..
      dockerfile: deploy/hosted/Dockerfile
    restart: unless-stopped
    mem_limit: ${BRAVEDUCK_MEM_LIMIT:-2g}
    pids_limit: 512
    # Never published: only Caddy reaches it, on the compose network.
    expose:
      - "8080"
    environment:
      # Optional: Jev rates every user's new jobs with this key, so it pays
      # for all of them. Leave empty to rate by AI agents only.
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      # Every browser (link fetches, CV PDFs) runs in the browser service.
      BRAVEDUCK_BROWSER_SERVICE: ws://browser:7317
      BRAVEDUCK_BROWSER_KEY_FILE: /run/secrets/browser_secret
    networks:
      - default
      - browser
      - scanner
    depends_on:
      - browser
    command:
      - serve
      - --users=/data/users
      - --addr=0.0.0.0:8080
      - --proxy-secret-file=/run/secrets/proxy_secret
      - --max-users=${BRAVEDUCK_MAX_USERS:-50}
      - --max-browsers=${BRAVEDUCK_MAX_BROWSERS:-2}
      - --jev-daily-limit=${BRAVEDUCK_JEV_DAILY_LIMIT:-50}
      - --max-jobs-per-user=${BRAVEDUCK_MAX_JOBS_PER_USER:-5000}
      - --logout-url=https://${AUTH_DOMAIN}/logout
      - --login-users-file=/authelia/users_database.yml
      # The Facebook scanner (profile "facebook") reaches this port only on
      # the private scanner network.
      - --scanner-addr=0.0.0.0:8090
      - --scanner-key-file=/run/secrets/scanner_secret
    volumes:
      - braveduck_data:/data # one folder per user under /data/users
      # Read-only: an agent key stops working when its user is disabled or
      # removed here, as their login does.
      - ./authelia/users_database.yml:/authelia/users_database.yml:ro
    secrets:
      - proxy_secret
      - browser_secret
      - scanner_secret

  # The browser service (go-rod's launcher manager, behind a key): Chromium
  # renders other sites' pages here, in a container with no users' data and
  # only its own key, on a network of its own (it can't reach Caddy or
  # Authelia; braveduck refuses it without the proxy secret). Each browser
  # is killed when braveduck disconnects, and pages can't start new ones.
  browser:
    build:
      context: ../..
      dockerfile: deploy/hosted/Dockerfile
    restart: unless-stopped
    command:
      - browser-service
      - --addr=:7317
      - --key-file=/run/secrets/browser_secret
    environment:
      HOME: /tmp
    secrets:
      - browser_secret
    networks:
      - browser
    read_only: true
    tmpfs:
      # go-rod runs its small watchdog binary ("leakless", which kills
      # browsers if the service dies) from /tmp, so this tmpfs needs exec.
      - /tmp:exec,mode=1777,size=1g
    shm_size: 1gb
    mem_limit: 2g
    pids_limit: 512
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Optional: fb-watcher reads the Facebook groups people follow (pasted
  # group links), with one logged-in Facebook account, and hands public
  # groups' posts to braveduck. Start it with --profile facebook; it builds
  # from a checkout of github.com/khangpworking/fb-watcher next to this repo
  # (or FB_WATCHER_DIR). See README "Facebook groups".
  fbwatcher:
    profiles: ["facebook"]
    build:
      context: ${FB_WATCHER_DIR:-../../../fb-watcher}
    restart: unless-stopped
    networks:
      - scanner
    volumes:
      - fbwatcher_data:/data # login profile, seen.db, config.json
    secrets:
      - scanner_secret
    shm_size: 1gb
    mem_limit: 2g
    depends_on:
      - braveduck

networks:
  default:
  browser:
  scanner:

secrets:
  proxy_secret:
    file: ./secrets/proxy_secret
  browser_secret:
    file: ./secrets/browser_secret
  scanner_secret:
    file: ./secrets/scanner_secret
  session_secret:
    file: ./secrets/session_secret
  storage_encryption_key:
    file: ./secrets/storage_encryption_key
  jwt_secret:
    file: ./secrets/jwt_secret

volumes:
  caddy_data:
  caddy_config:
  braveduck_data:
  fbwatcher_data:
